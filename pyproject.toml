[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = [
  "plugins/context-guard/hooks",
  "plugins/context-guard/tools",
  "plugins/refine-gate/hooks",
  "plugins/refine-gate/tools",
  "plugins/statusline/assets",
]
# coverage.py 7.10+ starts measurement at Python subprocess startup. The
# existing contract tests invoke the shipped hook entry points as subprocesses,
# so this measures what actually executes instead of replacing those tests with
# direct function calls solely to make the percentage move.
# source: https://coverage.readthedocs.io/en/7.15.2/subprocess.html
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 0
fail_under = 80
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
# The hooks run under the host's bare `python3` (plugins/*/hooks/hooks.json),
# which on macOS is /usr/bin/python3, Python 3.9.6. Without a declared target,
# ruff 0.17 assumes a newer Python and proposes 3.10/3.11-only rewrites
# (UP017 datetime.UTC) that would break those hooks; py39 makes it flag the
# 3.10-only syntax instead (FA102). tests/test_python39_floor.py imports every
# shipped module under a real 3.9 interpreter.
target-version = "py39"
